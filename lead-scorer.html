<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Scorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1420;--card:#171d2b;--ink:#e8ecf4;--mut:#9aa4b8;--acc:#ff7a1a;--ok:#3ccf8e;--warn:#ffc857;--bad:#ff5c5c;--line:#26304a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Inter,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;background:#0c111b;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}
button{background:var(--acc);color:#111;border:0;border-radius:8px;padding:11px 18px;font:600 15px inherit;cursor:pointer}
button.sec{background:#222b3f;color:var(--ink)}button:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:#0c111b;border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.tier{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.t1{background:#1f4d3a;color:var(--ok)}.t2{background:#4a3a14;color:var(--warn)}.t3{background:#2b3350;color:#aab6ff}.t4{background:#4a1f1f;color:var(--bad)}
.score{font-weight:700;font-size:16px}.mut{color:var(--mut)}.small{font-size:12px}
.pill{display:inline-block;background:#0c111b;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px}
.tblwrap{max-height:70vh;overflow:auto}
</style></head><body><div class="wrap">
<h1>Lead Scorer</h1>
<p class="sub">Upload a list. We enrich each lead with public signals, then Jev ranks who to contact first and drafts the opener. Nothing is bought beyond the signal lookup.</p>

<div class="card">
<div class="row">
<div><label>Team passcode</label><input id="pass" type="password" placeholder="ask Champ"></div>
<div><label>Your name</label><input id="owner" placeholder="so the run is yours"></div>
</div>
<label>List name</label><input id="listname" placeholder="e.g. APAC ERP CIOs Sep 26">
<label>What we sell and who we want (Jev reads this)</label>
<textarea id="icp">LakeB2B is the growth stack: verified B2B data, appointment setting and managed outbound, plus SEO, creative and demand gen. Ideal lead: IT, digital, data or transformation leaders (Director and above) at mid to large enterprises in APAC, ANZ, MEA and CEE, especially where a modernization, ERP, cloud or data project is live or a new leader has just joined.</textarea>
<div class="row">
<div><label>Upload CSV or XLSX</label><input id="file" type="file" accept=".csv,.xlsx,.xls"></div>
<div><label>Max rows this run</label><input id="max" type="number" value="150" min="1" max="1000"></div>
</div>
<div id="map" style="display:none">
<label>Column mapping (auto-detected, fix if wrong)</label>
<div class="row" id="mapgrid"></div>
</div>
<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input id="enrich" type="checkbox" checked style="width:auto"> Enrich with signals (LinkedIn profile and recent posts)</label>
<button id="run" disabled>Score this list</button>
<span id="status" class="mut small"></span>
</div>
<div class="bar"><i id="prog"></i></div>
</div>

<div class="card" id="out" style="display:none">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
<span class="pill" id="p-count"></span><span class="pill" id="p-tiers"></span><span class="pill" id="p-cost"></span><span class="pill" id="p-model"></span>
<span style="flex:1"></span>
<button class="sec" id="dl">Download CSV</button><button class="sec" id="share">Save and get share link</button>
</div>
<div id="sharelink" class="small mut"></div>
<div class="tblwrap"><table id="tbl"><thead><tr><th>#</th><th>Score</th><th>Tier</th><th>Lead</th><th>Top signal</th><th>Why</th><th>Opener</th><th>Links</th></tr></thead><tbody></tbody></table></div>
</div>
</div>
<script>
const API='https://kdxmzaliwestummrnygd.supabase.co/functions/v1/lead-scorer';const $=id=>document.getElementById(id);
const FIELDS={name:['full name','name','contact','contact name','person'],first:['first name','first','firstname','given name'],last:['last name','last','lastname','surname','family name'],title:['title','job title','designation','position','role'],company:['company','company name','account','organization','organisation','employer'],domain:['domain','website','company url','company website','url','web'],email:['email','business email','work email','email address','e-mail'],linkedin:['linkedin','linkedin url','profile url','prospect url','linkedin profile','li url']};
let rows=[],headers=[],results=[],lastMeta={};
try{$('pass').value=localStorage.getItem('ls_pass')||'';$('owner').value=localStorage.getItem('ls_owner')||'';}catch(e){}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function guess(){const m={};for(const f in FIELDS){m[f]='';for(const h of headers){const n=norm(h);if(FIELDS[f].some(a=>n===a)){m[f]=h;break}}if(!m[f])for(const h of headers){const n=norm(h);if(FIELDS[f].some(a=>n.includes(a))){m[f]=h;break}}}return m}
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{defval:''});rows=data;headers=Object.keys(data[0]||{});const m=guess();$('mapgrid').innerHTML=Object.keys(FIELDS).map(f=>'<div><label>'+f+'</label><select data-f="'+f+'"><option value="">(none)</option>'+headers.map(h=>'<option '+(m[f]===h?'selected':'')+'>'+h.replace(/</g,'&lt;')+'</option>').join('')+'</select></div>').join('');$('map').style.display='block';$('run').disabled=false;$('status').textContent=rows.length+' rows loaded';if(!$('listname').value)$('listname').value=f.name.replace(/\.[^.]+$/,'')};r.readAsArrayBuffer(f)});
function mapped(){const m={};document.querySelectorAll('#mapgrid select').forEach(s=>m[s.dataset.f]=s.value);const max=Math.min(rows.length,parseInt($('max').value)||150);return rows.slice(0,max).map((r,i)=>{const o={_i:i+1};for(const f in m){if(m[f])o[f]=String(r[m[f]]||'').trim()}if(!o.name&&(o.first||o.last))o.name=((o.first||'')+' '+(o.last||'')).trim();if(o.domain)o.domain=o.domain.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];if(!o.domain&&o.email&&o.email.includes('@'))o.domain=o.email.split('@')[1];return o})}
$('run').addEventListener('click',async()=>{const pass=$('pass').value.trim();if(!pass){alert('Passcode needed');return}try{localStorage.setItem('ls_pass',pass);localStorage.setItem('ls_owner',$('owner').value)}catch(e){}
const list=mapped();const B=8;results=[];let cost=0,model='';$('run').disabled=true;$('out').style.display='none';$('tbl').querySelector('tbody').innerHTML='';
for(let i=0;i<list.length;i+=B){$('status').textContent='Scoring '+Math.min(i+B,list.length)+' of '+list.length+'...';$('prog').style.width=Math.round(100*i/list.length)+'%';
try{const r=await fetch(API+'?action=score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pass,icp:$('icp').value,enrich:$('enrich').checked,rows:list.slice(i,i+B)})});const d=await r.json();if(d.error){$('status').textContent='Error: '+d.error;$('run').disabled=false;return}results.push(...d.results);cost+=d.cost||0;model=d.model;if(d.llm_error)lastMeta.llm_error=d.llm_error;render(cost,model)}catch(e){$('status').textContent='Batch failed, continuing: '+e;}}
$('prog').style.width='100%';$('status').textContent='Done. '+results.length+' leads scored.'+(lastMeta.llm_error?' Jev fallback note: '+lastMeta.llm_error:'');$('run').disabled=false});
function tcls(t){return t==='Contact now'?'t1':t==='This week'?'t2':t==='Nurture'?'t3':'t4'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(cost,model){results.sort((a,b)=>b.score-a.score);const tb=$('tbl').querySelector('tbody');tb.innerHTML=results.map((r,i)=>'<tr><td class="mut">'+(i+1)+'</td><td class="score">'+r.score+'</td><td><span class="tier '+tcls(r.tier)+'">'+r.tier+'</span></td><td><b>'+esc(r.name)+'</b><br><span class="mut small">'+esc(r.enriched_title||r.title)+(r.enriched_company||r.company?' at '+esc(r.enriched_company||r.company):'')+'</span></td><td>'+esc(r.top_signal)+'</td><td class="small">'+esc(r.reason)+(r.notes?'<br><span class="mut">'+esc(r.notes)+'</span>':'')+'</td><td class="small">'+esc(r.opener)+'</td><td class="small">'+(r.linkedin?'<a href="'+esc(r.linkedin)+'" target="_blank" style="color:#aab6ff">LinkedIn</a>':'')+(r.email?'<br><span class="mut">'+esc(r.email)+'</span>':'')+'</td></tr>').join('');
const t={};results.forEach(r=>t[r.tier]=(t[r.tier]||0)+1);$('p-count').textContent=results.length+' leads';$('p-tiers').textContent=Object.entries(t).map(([k,v])=>k+': '+v).join(' | ');$('p-cost').textContent='Signal cost $'+cost.toFixed(3);$('p-model').textContent='Model: '+model;$('out').style.display='block'}
$('dl').addEventListener('click',()=>{const cols=['score','tier','name','title','enriched_title','company','enriched_company','domain','email','linkedin','top_signal','reason','opener','role_start','recent_posts','notes'];const csv=[cols.join(',')].concat(results.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=($('listname').value||'scored')+'-scored.csv';a.click()});
$('share').addEventListener('click',async()=>{const r=await fetch(API+'?action=save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:$('pass').value.trim(),owner:$('owner').value,list_name:$('listname').value,icp:$('icp').value,results,cost:parseFloat(($('p-cost').textContent.match(/[\d.]+/)||['0'])[0])})});const d=await r.json();if(d.id){const u=location.origin+location.pathname+'?run='+d.id;$('sharelink').innerHTML='Saved. Share link: <a style="color:#aab6ff" href="'+u+'">'+u+'</a>'}else $('sharelink').textContent='Save failed: '+(d.error||'')});
(async()=>{const id=new URLSearchParams(location.search).get('run');if(!id)return;const r=await fetch(API+'?run='+id);const d=await r.json();if(d.results){results=d.results;$('listname').value=d.list_name||'';$('icp').value=d.icp||$('icp').value;render(Number(d.treg_cost_usd||0),'saved run by '+(d.owner||'unknown'));$('status').textContent='Viewing saved run from '+new Date(d.created_at).toLocaleString()}})();
</script></body></html>
