<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>og image</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E1A33">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="system.css">
  <style>
    /* The brand OG template, identity kit v1 (Oct 2026). 1200 by 630.
       scripts/brand/og-render.mjs screenshots og.html?page=<id> into og/<id>.png.
       Title, wordmark and mare stay inside the area platforms do not crop. */
    html, body { margin: 0; background: var(--navy); }
    .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden; background: var(--navy); color: var(--text); }
    .og-wm { position: absolute; left: 96px; top: 64px; width: 240px; height: auto; }
    .og-tag { position: absolute; right: 96px; top: 84px; font: 600 22px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--win); }
    .og-body { position: absolute; left: 96px; top: 246px; width: 700px; }
    .og-title { margin: 0; font: 900 76px/1.02 var(--font-display); font-variation-settings: "WONK" 1; letter-spacing: -.015em; color: var(--text); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .og-sub { margin: 22px 0 0; font: 400 30px/1.3 var(--font-ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .og-mare { position: absolute; right: 96px; bottom: 60px; height: 300px; width: auto; }
    .og-foot { position: absolute; left: 0; right: 0; bottom: 0; }
    .og-foot .drops { margin: 0 96px 18px; width: auto; }
    .og-url { position: absolute; left: 96px; bottom: 82px; font: 500 22px/1 var(--font-mono); color: var(--dim); }
  </style>
</head>
<body>
  <div class="og" id="og">
    <img class="og-wm" src="brand/wordmark.svg" width="240" height="145" alt="Deep">
    <span class="og-tag" id="tag">building in public</span>
    <div class="og-body">
      <h1 class="og-title" id="title">i’m Deep and i ship every weekday.</h1>
      <p class="og-sub" id="sub">12 companies, 1 operator, one public log.</p>
    </div>
    <span class="og-url">deependhq.com</span>
    <img class="og-mare" src="brand/mare-sticker.svg" width="268" height="300" alt="">
    <div class="og-foot"><div class="drops"></div><div class="stripes"></div></div>
  </div>
  <script>
    // One card per top-level page, keyed by id. ?title= ?sub= ?tag= override,
    // which is how a per-entry card can be rendered later.
    var PAGES = {
      home: { title: 'i’m Deep and i ship every weekday.', sub: '12 companies, 1 operator, one public log.', tag: 'building in public' },
      journey: { title: 'Mission Log.', sub: 'One entry every weekday. The gaps stay visible.', tag: 'mission log' },
      writing: { title: 'The weekly narratives.', sub: 'One essay a week, written from the log.', tag: 'writing' },
      toolkit: { title: 'What I build with.', sub: 'Built here, in daily use, trying, watching.', tag: 'the stack' },
      now: { title: 'What I am on right now.', sub: 'This month, in one snapshot.', tag: 'now' },
      pillars: { title: '12 companies, 1 operator.', sub: 'Four pillars, each with its last day in the log.', tag: 'pillars' },
      company: { title: 'One of the twelve.', sub: 'A Champions Group company, run in public.', tag: 'company' },
      'field-notes': { title: 'Field notes.', sub: 'The tools, arcs and words of building in public.', tag: 'field notes' },
      default: { title: 'Built in public, every weekday.', sub: 'Sreedeep Surapaneni, from 3 PM to 2 AM IST.', tag: 'deependhq.com' }
    };
    var q = new URLSearchParams(location.search);
    var p = PAGES[q.get('page')] || PAGES.home;
    ['title', 'sub', 'tag'].forEach(function (k) { document.getElementById(k).textContent = q.get(k) || p[k]; });
  </script>
</body>
</html>
